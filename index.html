<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchasing Order Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding: 15px;
}
.container {
  max-width: 600px;
  margin: 15px auto;
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 3px 15px #0001;
}
h2 {text-align:center;color:#17365d}
button {
  width:100%;
  padding:15px;
  margin:8px 0;
  border:0;
  border-radius:10px;
  background:#1769aa;
  color:white;
  font-size:16px;
}
input {
  width:100%;
  box-sizing:border-box;
  padding:15px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:18px;
}
#reader {margin:15px 0}
.camera-controls {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.camera-controls button {margin:0}
.camera-controls .wide {grid-column:1/-1}
#status {
  padding:13px;
  background:#f1f5f9;
  border-radius:9px;
  margin-top:12px;
}
.result-card {
  border:1px solid #ddd;
  border-radius:10px;
  margin-top:15px;
  overflow:hidden;
}
.result-card h3 {
  background:#17365d;
  color:white;
  padding:14px;
  margin:0;
}
.result-row {
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:12px;
  border-bottom:1px solid #eee;
}
.result-row strong {flex:1;color:#555}
.result-row span {
  flex:1;
  text-align:right;
  overflow-wrap:anywhere;
}
</style>
</head>
<body>

<div class="container">
<h2>📦 Order Barcode Scanner</h2>
<p style="text-align:center">
Online Shopping Purchasing Tracker
</p>

<button onclick="startScanner()">
📷 OPEN CAMERA SCANNER
</button>

<div id="reader"></div>
<div class="camera-controls">
  <button type="button" onclick="setFocusMode()">🎯 AUTO FOCUS</button>
  <button type="button" id="flashBtn" onclick="toggleFlash()">⚡ FLASH OFF</button>
  <button type="button" class="wide" onclick="readTextFromCamera()">🔤 READ LABEL TEXT (OCR)</button>
  <label class="wide">Camera Zoom <span id="zoomLabel">1×</span>
    <input id="zoomSlider" type="range" min="1" max="3" step="0.1" value="1" oninput="applyZoom(this.value)">
  </label>
</div>

<h3>Scanned Barcode</h3>
<input id="barcode" placeholder="Scan or enter Barcode">

<div id="status">Waiting for barcode... Scan a barcode to return it automatically to Purchasing Tracker.</div>
</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbx67rp0AzXNjsZdDbOSDz2kWa091ESFwXH8VsSjc34cDpM5xjkRlkht3jo2E2EA7YWs/exec";

let scanner = null;
let requestTimer = null;
let flashOn = false;
let currentTrack = null;
let zoomValue = null;
let barcodeReturnStarted = false;


async function startScanner() {
  if (scanner) return;
  scanner = new Html5Qrcode("reader");
  try {
    await scanner.start(
      {facingMode:"environment"},
      {
        fps:12,
        qrbox:(viewWidth, viewHeight) => {
          const width = Math.min(Math.floor(viewWidth * 0.92), 520);
          const height = Math.min(Math.floor(viewHeight * 0.38), 220);
          return {width, height};
        },
        aspectRatio: 1.6,
        disableFlip: false
      },
      async (text) => {
        document.getElementById("barcode").value = text;
        await stopScanner();
        returnBarcodeToDashboard(text);
      },
      () => {}
    );
    const video = document.querySelector("#reader video");
    if (video) {
      video.setAttribute("playsinline","true");
      video.addEventListener("click", tapToFocus);
      const stream = video.srcObject;
      if (stream) currentTrack = stream.getVideoTracks()[0];
      if (currentTrack && currentTrack.getCapabilities) {
        const caps = currentTrack.getCapabilities();
        const slider = document.getElementById("zoomSlider");
        if (caps.zoom && slider) {
          slider.min = caps.zoom.min;
          slider.max = caps.zoom.max;
          slider.step = caps.zoom.step || 0.1;
          slider.value = Math.max(caps.zoom.min, 1);
        }
      }
    }
    await setFocusMode();
  } catch(err) {
    scanner = null;
    setStatus("Camera error: " + err + ". Please allow camera access and reload.");
  }
}

async function tapToFocus() {
  const video = document.querySelector("#reader video");
  if (!currentTrack && video?.srcObject) currentTrack = video.srcObject.getVideoTracks()[0];
  if (!currentTrack) return;
  try {
    await currentTrack.applyConstraints({advanced:[{focusMode:"single-shot"}]});
    setStatus("Tap-to-focus requested.");
    setTimeout(() => setFocusMode(), 700);
  } catch(e) {
    setStatus("Tap focus is not supported by this camera. Keep the label steady and move slightly closer/farther.");
  }
}

async function setFocusMode() {
  const video = document.querySelector("#reader video");
  if (!currentTrack && video?.srcObject) currentTrack = video.srcObject.getVideoTracks()[0];
  if (!currentTrack) {
    setStatus("Start the camera first, then use Auto Focus.");
    return;
  }
  try {
    await currentTrack.applyConstraints({advanced:[{focusMode:"continuous"}]});
    setStatus("Continuous auto-focus enabled.");
  } catch(e) {
    setStatus("Continuous focus is not supported on this device. Tap the camera image to request focus.");
  }
}

async function toggleFlash() {
  const video = document.querySelector("#reader video");
  if (!currentTrack && video?.srcObject) currentTrack = video.srcObject.getVideoTracks()[0];
  if (!currentTrack) {
    setStatus("Open the camera before turning flash on/off.");
    return;
  }
  const next = !flashOn;
  try {
    await currentTrack.applyConstraints({advanced:[{torch:next}]});
    flashOn = next;
    document.getElementById("flashBtn").textContent = flashOn ? "⚡ FLASH ON" : "⚡ FLASH OFF";
    setStatus(flashOn ? "Flash turned on." : "Flash turned off.");
  } catch(e) {
    setStatus("Flash/torch control is not supported by this iPhone browser or camera. Use room lighting.");
  }
}

async function applyZoom(value) {
  const video = document.querySelector("#reader video");
  if (!currentTrack && video?.srcObject) currentTrack = video.srcObject.getVideoTracks()[0];
  const slider = document.getElementById("zoomSlider");
  const label = document.getElementById("zoomLabel");
  if (label) label.textContent = Number(value).toFixed(1) + "×";
  if (!currentTrack) return;
  try {
    const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
    if (!caps.zoom) {
      if (label) label.textContent = "Zoom unsupported";
      return;
    }
    const zoom = Math.max(caps.zoom.min, Math.min(caps.zoom.max, Number(value)));
    await currentTrack.applyConstraints({advanced:[{zoom}]});
  } catch(e) {
    if (label) label.textContent = "Zoom unsupported";
  }
}

async function readTextFromCamera() {
  const video = document.querySelector("#reader video");
  if (!video || !video.videoWidth) {
    setStatus("Open the camera and point it at the shipping label first.");
    return;
  }
  if (barcodeReturnStarted) return;
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const context = canvas.getContext("2d");
  context.drawImage(video, 0, 0, canvas.width, canvas.height);
  setStatus("OCR reading label text... Please wait.");
  try {
    const result = await Tesseract.recognize(canvas, "eng", {
      logger: m => {
        if (m.status === "recognizing text") {
          setStatus("OCR reading... " + Math.round((m.progress || 0) * 100) + "%");
        }
      }
    });
    const text = (result.data && result.data.text || "").trim();
    const candidates = text.match(/\d{8,25}/g) || [];
    if (!candidates.length) {
      setStatus("OCR completed, but no order number was detected. Adjust the label and try again.");
      return;
    }
    const preferred = candidates.find(n => /order/i.test(text.slice(Math.max(0, text.indexOf(n) - 60), text.indexOf(n))))
      || candidates.sort((a, b) => b.length - a.length)[0];
    document.getElementById("barcode").value = preferred;
    setStatus("Order number detected by OCR: " + preferred + ". Returning to Purchasing Tracker...");
    await stopScanner();
    returnBarcodeToDashboard(preferred);
  } catch (e) {
    setStatus("OCR failed: " + (e && e.message ? e.message : e));
  }
}

async function stopScanner() {
  if (!scanner) return;
  try {
    if (scanner.isScanning) await scanner.stop();
    await scanner.clear();
  } catch (e) {
    // Continue returning the barcode even if camera shutdown fails.
  } finally {
    scanner = null;
    if (currentTrack) {
      try { currentTrack.stop(); } catch (e) {}
      currentTrack = null;
    }
  }
}

function returnBarcodeToDashboard(value) {
  const barcode = String(value || "").trim();
  if (!barcode || barcodeReturnStarted) return;
  barcodeReturnStarted = true;
  document.getElementById("barcode").value = barcode;
  setStatus("Barcode detected: " + barcode + ". Returning to Purchasing Tracker...");

  const dashboardUrl = API_URL + "?barcode=" + encodeURIComponent(barcode);
  let acknowledged = false;
  const onAck = (event) => {
    if (event.origin !== "https://script.google.com") return;
    const data = event.data || {};
    if (data.type === "PURCHASING_TRACKER_BARCODE_ACK" && String(data.barcode) === barcode) {
      acknowledged = true;
      window.removeEventListener("message", onAck);
      setStatus("Barcode sent successfully. Closing scanner...");
      setTimeout(() => window.close(), 250);
    }
  };
  window.addEventListener("message", onAck);
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({type:"PURCHASING_TRACKER_BARCODE", barcode}, "*");
    }
  } catch (e) {}

  // Fallback: if the original tab cannot acknowledge, return the barcode by URL.
  setTimeout(() => {
    if (!acknowledged) {
      window.removeEventListener("message", onAck);
      window.location.replace(dashboardUrl);
    }
  }, 1500);
}

function setStatus(message) {
  document.getElementById("status").textContent = message;
}

</script>
</body>
</html>
