<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchasing Order Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding: 15px;
}
.container {
  max-width: 600px;
  margin: 15px auto;
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 3px 15px #0001;
}
h2 {text-align:center;color:#17365d}
button {
  width:100%;
  padding:15px;
  margin:8px 0;
  border:0;
  border-radius:10px;
  background:#1769aa;
  color:white;
  font-size:16px;
}
input {
  width:100%;
  box-sizing:border-box;
  padding:15px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:18px;
}
#reader {margin:15px 0}
.camera-controls {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.camera-controls button {margin:0}
.camera-controls .wide {grid-column:1/-1}
#ocrText {min-height:90px;margin-top:8px}
.small-note {font-size:13px;color:#64748b;line-height:1.45}
#status {
  padding:13px;
  background:#f1f5f9;
  border-radius:9px;
  margin-top:12px;
}
.result-card {
  border:1px solid #ddd;
  border-radius:10px;
  margin-top:15px;
  overflow:hidden;
}
.result-card h3 {
  background:#17365d;
  color:white;
  padding:14px;
  margin:0;
}
.result-row {
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:12px;
  border-bottom:1px solid #eee;
}
.result-row strong {flex:1;color:#555}
.result-row span {
  flex:1;
  text-align:right;
  overflow-wrap:anywhere;
}
</style>
</head>
<body>

<div class="container">
<h2>📦 Order Barcode Scanner</h2>
<p style="text-align:center">
Online Shopping Purchasing Tracker
</p>

<button onclick="startScanner()">
📷 OPEN CAMERA SCANNER
</button>

<div id="reader"></div>
<div class="camera-controls">
  <button type="button" onclick="setFocusMode()">🎯 AUTO FOCUS</button>
  <button type="button" id="flashBtn" onclick="toggleFlash()">⚡ FLASH OFF</button>
  <button type="button" class="wide" onclick="readTextFromCamera()">🔤 READ LABEL TEXT (OCR)</button>
  <label class="wide">Camera Zoom <span id="zoomLabel">1×</span>
    <input id="zoomSlider" type="range" min="1" max="3" step="0.1" value="1" oninput="applyZoom(this.value)">
  </label>
</div>
<p class="small-note">အာရုံစိုက်ရန် Camera ပုံပေါ်ကို တစ်ချက်နှိပ်ပါ။ Barcode မဖတ်နိုင်ပါက READ LABEL TEXT ကိုနှိပ်ပြီး Order Number ကို OCR ဖြင့်ဖတ်နိုင်ပါတယ်။</p>
<label>OCR Text (စာသား)</label>
<textarea id="ocrText" placeholder="Detected label text will appear here..."></textarea>

<h3>Scanned Barcode</h3>
<input id="barcode" placeholder="Scan or enter Barcode">

<button onclick="searchOrder()">🔍 SEARCH ORDER</button>

<div id="status">Waiting for barcode...</div>
<div id="results"></div>
</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbx67rp0AzXNjsZdDbOSDz2kWa091ESFwXH8VsSjc34cDpM5xjkRlkht3jo2E2EA7YWs/exec";

let scanner = null;
let requestTimer = null;
let flashOn = false;
let currentTrack = null;
let zoomValue = null;


async function startScanner() {
  if (scanner) return;
  scanner = new Html5Qrcode("reader");
  try {
    await scanner.start(
      {facingMode:"environment"},
      {
        fps:12,
        qrbox:(viewWidth, viewHeight) => {
          const width = Math.min(Math.floor(viewWidth * 0.92), 520);
          const height = Math.min(Math.floor(viewHeight * 0.38), 220);
          return {width, height};
        },
        aspectRatio: 1.6,
        disableFlip: false
      },
      async (text) => {
        document.getElementById("barcode").value = text;
        await stopScanner();
        const params = new URLSearchParams(window.location.search);
        if (params.get("returnToDashboard") === "1") {
          const dashboardUrl = "https://script.google.com/macros/s/AKfycbx67rp0AzXNjsZdDbOSDz2kWa091ESFwXH8VsSjc34cDpM5xjkRlkht3jo2E2EA7YWs/exec?barcode="
            + encodeURIComponent(text);
          setStatus("Barcode detected: " + text + ". Sending to Purchasing Tracker...");
          // Best effort: notify the original tab first.
          try {
            if (window.opener && !window.opener.closed) {
              window.opener.postMessage(
                { type: "PURCHASING_TRACKER_BARCODE", barcode: text },
                "https://script.google.com"
              );
            }
          } catch (e) {}
          // Reliable fallback: navigate this scanner tab to the dashboard URL.
          // This avoids depending on iOS Safari's cross-origin opener behavior.
          setTimeout(() => {
            window.location.replace(dashboardUrl);
          }, 350);
        } else {
          setStatus("Barcode detected. You can search or read label text.");
        }
      },
      () => {}
    );
    const video = document.querySelector("#reader video");
    if (video) {
      video.setAttribute("playsinline","true");
      video.addEventListener("click", tapToFocus);
      const stream = video.srcObject;
      if (stream) currentTrack = stream.getVideoTracks()[0];
      if (currentTrack && currentTrack.getCapabilities) {
        const caps = currentTrack.getCapabilities();
        const slider = document.getElementById("zoomSlider");
        if (caps.zoom && slider) {
          slider.min = caps.zoom.min;
          slider.max = caps.zoom.max;
          slider.step = caps.zoom.step || 0.1;
          slider.value = Math.max(caps.zoom.min, 1);
        }
      }
    }
    await setFocusMode();
  } catch(err) {
    scanner = null;
    setStatus("Camera error: " + err + ". Please allow camera access and reload.");
  }
}

async function tapToFocus() {
  const video = document.querySelector("#reader video");
  if (!currentTrack && video?.srcObject) currentTrack = video.srcObject.getVideoTracks()[0];
  if (!currentTrack) return;
  try {
    await currentTrack.applyConstraints({advanced:[{focusMode:"single-shot"}]});
    setStatus("Tap-to-focus requested.");
    setTimeout(() => setFocusMode(), 700);
  } catch(e) {
    setStatus("Tap focus is not supported by this camera. Keep the label steady and move slightly closer/farther.");
  }
}

async function setFocusMode() {
  const video = document.querySelector("#reader video");
  if (!currentTrack && video?.srcObject) currentTrack = video.srcObject.getVideoTracks()[0];
  if (!currentTrack) {
    setStatus("Start the camera first, then use Auto Focus.");
    return;
  }
  try {
    await currentTrack.applyConstraints({advanced:[{focusMode:"continuous"}]});
    setStatus("Continuous auto-focus enabled.");
  } catch(e) {
    setStatus("Continuous focus is not supported on this device. Tap the camera image to request focus.");
  }
}

async function toggleFlash() {
  const video = document.querySelector("#reader video");
  if (!currentTrack && video?.srcObject) currentTrack = video.srcObject.getVideoTracks()[0];
  if (!currentTrack) {
    setStatus("Open the camera before turning flash on/off.");
    return;
  }
  const next = !flashOn;
  try {
    await currentTrack.applyConstraints({advanced:[{torch:next}]});
    flashOn = next;
    document.getElementById("flashBtn").textContent = flashOn ? "⚡ FLASH ON" : "⚡ FLASH OFF";
    setStatus(flashOn ? "Flash turned on." : "Flash turned off.");
  } catch(e) {
    setStatus("Flash/torch control is not supported by this iPhone browser or camera. Use room lighting.");
  }
}

async function applyZoom(value) {
  const video = document.querySelector("#reader video");
  if (!currentTrack && video?.srcObject) currentTrack = video.srcObject.getVideoTracks()[0];
  const slider = document.getElementById("zoomSlider");
  const label = document.getElementById("zoomLabel");
  if (label) label.textContent = Number(value).toFixed(1) + "×";
  if (!currentTrack) return;
  try {
    const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
    if (!caps.zoom) {
      if (label) label.textContent = "Zoom unsupported";
      return;
    }
    const zoom = Math.max(caps.zoom.min, Math.min(caps.zoom.max, Number(value)));
    await currentTrack.applyConstraints({advanced:[{zoom}]});
  } catch(e) {
    if (label) label.textContent = "Zoom unsupported";
  }
}

async function readTextFromCamera() {
  const video = document.querySelector("#reader video");
  if (!video || !video.videoWidth) {
    setStatus("Open the camera and point it at the shipping label first.");
    return;
  }
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);
  setStatus("Reading label text with OCR. Please wait...");
  try {
    const result = await Tesseract.recognize(canvas, "eng", {
      logger: m => {
        if (m.status === "recognizing text") setStatus("OCR reading... " + Math.round((m.progress || 0)*100) + "%");
      }
    });
    const text = (result.data && result.data.text || "").trim();
    document.getElementById("ocrText").value = text;
    const candidates = text.match(/\d{8,25}/g) || [];
    if (candidates.length) {
      const preferred = candidates.find(n => /order/i.test(text.slice(Math.max(0,text.indexOf(n)-60),text.indexOf(n)))) || candidates.sort((a,b)=>b.length-a.length)[0];
      document.getElementById("barcode").value = preferred;
      setStatus("OCR found a possible order number: " + preferred + ". Check it, then Search Order.");
    } else {
      setStatus("Text was read, but no long number was detected. Copy the correct number from OCR Text into the barcode field.");
    }
  } catch(e) {
    setStatus("OCR failed: " + e.message);
  }
}

function setStatus(message) {
  document.getElementById("status").textContent = message;
}

function searchOrder() {
  const barcode = document.getElementById("barcode").value.trim();

  if (!barcode) {
    setStatus("Please enter or scan a barcode.");
    return;
  }

  document.getElementById("results").replaceChildren();
  setStatus("Searching Google Sheets...");

  if (requestTimer) clearTimeout(requestTimer);

  const old = document.getElementById("api-script");
  if (old) old.remove();

  window.orderSearchCallback = function(data) {
    clearTimeout(requestTimer);

    if (!data.success) {
      setStatus(data.message || "Order not found.");
      return;
    }

    setStatus("Order found - Row " + data.row);
    showResults(data);
    
  };

  const script = document.createElement("script");
  script.id = "api-script";

  script.onerror = function() {
    clearTimeout(requestTimer);
    setStatus("Connection failed. Check Google login and Web App access.");
  };

  script.src = API_URL +
    "?barcode=" + encodeURIComponent(barcode) +
    "&callback=orderSearchCallback&_=" + Date.now();

  document.body.appendChild(script);

  requestTimer = setTimeout(() => {
    setStatus("Request timed out. Check Web App permission.");
    script.remove();
  }, 20000);
}

function showResults(data) {
  const container = document.getElementById("results");
  container.replaceChildren();

  const card = document.createElement("div");
  card.className = "result-card";

  const heading = document.createElement("h3");
  heading.textContent = "📦 ORDER DETAILS";
  card.appendChild(heading);

  data.data.forEach(item => {
    const row = document.createElement("div");
    row.className = "result-row";

    const label = document.createElement("strong");
    label.textContent = item.label;

    const value = document.createElement("span");
    value.textContent = item.value;

    row.append(label, value);
    card.appendChild(row);
  });

  container.appendChild(card);
  const goButton = document.createElement("button");
  goButton.textContent = "📊 GO TO ROW " + data.row;

  goButton.style.background = "#188038";

  goButton.onclick = function() {
    if (data.rowUrl) {
      window.open(data.rowUrl, "_blank");
    }
  };

  container.appendChild(goButton);
}
</script>
</body>
</html>
